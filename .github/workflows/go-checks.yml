name: Go checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PDF text tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check Go format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Check review verifier
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_review.py'
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Race tests
        run: go test -race ./... -count=1

  postgres:
    name: PostGIS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: landman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d landman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:disposable@localhost:5432/landman_test?sslmode=disable
      TAX_GOLDEN_DB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PDF text tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.30.0
      - name: Apply migrations
        run: |
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$DATABASE_URL" up
      # These packages share one database; run them in sequence for stable row counts.
      - name: Race tests with PostgreSQL
        run: go test -p 1 -race -tags postgres ./cmd/landman ./internal/parcelstore/ ./internal/taxstore/ -count=1
